version: "3.9"

services:
  turnero-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: turnero-app:prod
    container_name: turnero-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "https://+:443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /etc/letsencrypt/live/${LETSENCRYPT_DOMAIN}/fullchain.pem
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /etc/letsencrypt/live/${LETSENCRYPT_DOMAIN}/privkey.pem
      ConnectionStrings__PostgresConnection: ${ConnectionStrings__PostgresConnection}
      Firebase__CredentialsPath: /run/secrets/firebase.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - ./.env:/app/.env:ro
      - ${FIREBASE_CREDENTIALS_FILE:-./secrets/firebase.json}:/run/secrets/firebase.json:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:443/health); [ \"$$code\" -ge 200 ] && [ \"$$code\" -lt 500 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    cpus: "1.0"
    mem_limit: 1536m
    mem_reservation: 512m
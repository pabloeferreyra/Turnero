services:
  redis:
    image: redis:7-alpine
    container_name: turnero-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  turnero-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: turnero-app:prod
    container_name: turnero-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgresConnection: ${ConnectionStrings__PostgresConnection}
      Firebase__CredentialsPath: /run/secrets/firebase.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      Redis__ConnectionString: redis:6379
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env:ro
      - ${FIREBASE_CREDENTIALS_FILE}:/run/secrets/firebase.json:ro
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health); [ \"$$code\" -ge 200 ] && [ \"$$code\" -lt 500 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    cpus: "1.0"
    mem_limit: 768m
    mem_reservation: 256m

volumes:
  redis-data:

version: "3.9"

# Development overlay: adds Redis Commander web admin UI for inspecting the Redis cache.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Open http://localhost:8081 to browse and manage cached data.

services:
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: turnero-redis-commander
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
